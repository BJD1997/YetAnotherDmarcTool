name: Release

# Publishes a versioned image to GHCR on a tagged release (e.g. v0.1.0).
# Assumes the tagged commit already passed ci.yml — tags are cut from
# already-merged master, so this doesn't re-run the test suite itself.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives a lowercased image ref — GHCR rejects uppercase, and this
      # repo's owner/name (BJD1997/YetAnotherDmarcTool) is mixed-case, so
      # hand-building the ref risks a push that looks fine in the YAML but
      # fails at push time. type=ref,event=tag uses the raw git tag as-is
      # (e.g. "v0.1.0") — deliberately NOT type=semver, which strips the
      # "v" prefix and would leave the published image tag ("0.1.0") not
      # matching the git tag ("v0.1.0"), GET /api/health's baked-in
      # APP_VERSION, or the tag_name GitHub's releases API reports (all of
      # which use the raw ref) — an operator pinning APP_VERSION to match
      # the git tag they saw on GitHub would otherwise get "manifest
      # unknown" from `docker compose pull`.
      #
      # The `latest` tag is skipped for any ref containing a hyphen (e.g.
      # v0.1.2-rc1) — those are prerelease-style tags (see
      # update_check_include_prereleases), and :latest must keep meaning
      # "latest stable" for every self-hoster whose update check doesn't
      # opt into prereleases.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
