# YetAnotherDmarcTool — Portainer Stacks variant (self-contained).
#
# Deploy this with Portainer's **Web editor** (Stacks → Add stack → Web
# editor): paste this file, set the variables under "Environment variables",
# and deploy. The Web editor is what makes the variables work — Portainer
# builds the stack's env from them there. (The Repository method does NOT:
# it expects a stack.env committed in the repo, so the variables you type in
# the UI are ignored and every ${VAR} falls back to its default — which is
# why API_HOST_PORT wouldn't take and it kept trying to bind :8000.)
#
# It needs nothing from the repo: the two files the CLI compose bind-mounts
# (the Postgres init script that creates the RLS role, and the resolver
# config) are embedded below via `configs:`, so there are no host paths to
# mount and no `build:` — it just pulls the published image. Requires Docker
# Compose v2.23+ (for inline config `content:`), which current Portainer ships.
#
# Required variables: FERNET_KEY, PUBLIC_BASE_URL, POSTGRES_PASSWORD,
# DMARC_APP_DB_PASSWORD. Set API_HOST_PORT if :8000 is taken on the host.
# See the README "Deploy with Portainer" section for the full list.

configs:
  # The RLS runtime role, created on the DB's first init. Postgres runs any
  # *.sh here as the superuser before the app connects. $$ escapes Compose
  # interpolation so the literal $VARs reach the script and bash expands them
  # from the db container's own environment (the password never appears here).
  db_init_role:
    content: |
      #!/bin/bash
      set -e
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" -c "CREATE ROLE dmarc_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD '$${DMARC_APP_DB_PASSWORD}';"
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" -c "GRANT CONNECT ON DATABASE \"$$POSTGRES_DB\" TO dmarc_app;"
  # Unbound: forward over DNS-over-TLS to Cloudflare, and pull in the cache
  # overrides below (same config the CLI compose bind-mounts).
  unbound_forward:
    content: |
      forward-zone:
          name: "."
          forward-tls-upstream: yes
          forward-addr: 1.1.1.1@853#cloudflare-dns.com
          forward-addr: 1.0.0.1@853#cloudflare-dns.com
      include: /opt/unbound/etc/unbound/unbound.conf.d/overrides.conf
  unbound_overrides:
    content: |
      server:
          # Reachable from the stack's internal network (any Docker private
          # subnet), not just loopback.
          access-control: 172.16.0.0/12 allow
          access-control: 10.0.0.0/8 allow
          access-control: 192.168.0.0/16 allow
          # Trust origin TTLs instead of the base image's 5-min floor, and
          # don't serve stale answers indefinitely — a just-published record
          # must resolve promptly for the DNS checks to be accurate.
          cache-min-ttl: 0
          cache-max-negative-ttl: 60
          serve-expired-client-timeout: 1800

# Shared app config, merged into api/worker/migrate. Anything left unset in
# Portainer keeps its feature switched off (same feature-gating as .env.example).
x-app-environment: &app-environment
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to your public https URL}
  FERNET_KEY: ${FERNET_KEY:?generate one - see the README}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DNS_RESOLVER_HOST: resolver
  PLATFORM_ADMIN_BOOTSTRAP_EMAIL: ${PLATFORM_ADMIN_BOOTSTRAP_EMAIL:-}
  PLATFORM_ADMIN_BOOTSTRAP_PASSWORD: ${PLATFORM_ADMIN_BOOTSTRAP_PASSWORD:-}
  ENTRA_MAIL_CLIENT_ID: ${ENTRA_MAIL_CLIENT_ID:-}
  ENTRA_MAIL_CLIENT_SECRET: ${ENTRA_MAIL_CLIENT_SECRET:-}
  ENTRA_SSO_CLIENT_ID: ${ENTRA_SSO_CLIENT_ID:-}
  ENTRA_SSO_CLIENT_SECRET: ${ENTRA_SSO_CLIENT_SECRET:-}
  ENTRA_SSO_AUTHORITY: ${ENTRA_SSO_AUTHORITY:-https://login.microsoftonline.com/organizations}
  HOSTED_REPORTS_TENANT_ID: ${HOSTED_REPORTS_TENANT_ID:-}
  HOSTED_REPORTS_MAILBOX_ADDRESS: ${HOSTED_REPORTS_MAILBOX_ADDRESS:-}
  HOSTED_REPORTS_ADDRESS_DOMAIN: ${HOSTED_REPORTS_ADDRESS_DOMAIN:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
  SECURITY_CONTACT_EMAIL: ${SECURITY_CONTACT_EMAIL:-}
  MTA_STS_POLICY_HOSTNAME: ${MTA_STS_POLICY_HOSTNAME:-}
  MTA_STS_POLICY_BODY: ${MTA_STS_POLICY_BODY:-}
  UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-true}
  UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-BJD1997/YetAnotherDmarcTool}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dmarc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dmarc}
      DMARC_APP_DB_PASSWORD: ${DMARC_APP_DB_PASSWORD:?set a strong DMARC_APP_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    configs:
      - source: db_init_role
        target: /docker-entrypoint-initdb.d/01-create-app-role.sh
        mode: 0755
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dmarc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  resolver:
    image: mvance/unbound:latest
    restart: unless-stopped
    configs:
      - source: unbound_forward
        target: /opt/unbound/etc/unbound/forward-records.conf
      - source: unbound_overrides
        target: /opt/unbound/etc/unbound/unbound.conf.d/overrides.conf
    networks:
      - internal

  migrate:
    image: ghcr.io/bjd1997/yetanotherdmarctool:${APP_VERSION:-latest}
    command: sh -c "alembic upgrade head && python -m app.scripts.bootstrap_platform_admin"
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dmarc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dmarc}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    image: ghcr.io/bjd1997/yetanotherdmarctool:${APP_VERSION:-latest}
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+asyncpg://dmarc_app:${DMARC_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-dmarc}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      resolver:
        condition: service_started
    networks:
      - internal

  worker:
    image: ghcr.io/bjd1997/yetanotherdmarctool:${APP_VERSION:-latest}
    restart: unless-stopped
    command: python -m app.workers.scheduler
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+asyncpg://dmarc_app:${DMARC_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-dmarc}
    depends_on:
      migrate:
        condition: service_completed_successfully
      resolver:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db_data:
