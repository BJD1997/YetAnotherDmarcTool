services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dmarc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmarc}
      POSTGRES_DB: ${POSTGRES_DB:-dmarc}
      # Read by db/init/01-create-app-role.sh on first startup only, to
      # create the non-superuser `dmarc_app` runtime role.
      DMARC_APP_DB_PASSWORD: ${DMARC_APP_DB_PASSWORD:-dmarc_app}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dmarc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  resolver:
    image: mvance/unbound:latest
    restart: unless-stopped
    volumes:
      # forward-records.conf is one of the few files the base image's
      # entrypoint actually includes into its generated unbound.conf (see
      # that file's own header comment) — overrides.conf is pulled in
      # through it, not auto-loaded by being in unbound.conf.d/.
      - ./resolver/forward-records.conf:/opt/unbound/etc/unbound/forward-records.conf:ro
      - ./resolver/overrides.conf:/opt/unbound/etc/unbound/unbound.conf.d/overrides.conf:ro
    networks:
      - internal

  # One-off: applies Alembic migrations (as the DB *owner* role, needed for
  # CREATE TABLE/CREATE POLICY/GRANT) and bootstraps the first platform-admin
  # account if none exists yet, then exits. api/worker wait for it to
  # complete successfully before starting.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # image: lets `docker compose pull` fetch a published release instead
    # of rebuilding from source — `docker compose build` still builds
    # fresh and tags locally as this same name, so local dev is unaffected.
    # APP_VERSION here picks which published tag to pull; it's unrelated
    # to the Dockerfile ARG of the same name, which only matters for a
    # from-source build (see .env.example).
    image: ghcr.io/bjd1997/yetanotherdmarctool:${APP_VERSION:-latest}
    command: sh -c "alembic upgrade head && python -m app.scripts.bootstrap_platform_admin"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dmarc}:${POSTGRES_PASSWORD:-dmarc}@db:5432/${POSTGRES_DB:-dmarc}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/bjd1997/yetanotherdmarctool:${APP_VERSION:-latest}
    restart: unless-stopped
    # --forwarded-allow-ips: without this, request.client.host (used for
    # session/sign-in-event ip_address) is the reverse proxy's own IP, not
    # the real visitor's — uvicorn only unwraps X-Forwarded-For from an
    # explicitly trusted peer. Set FORWARDED_ALLOW_IPS to your reverse
    # proxy's IP (see .env.example). Defaults to 127.0.0.1 (trust nothing
    # external) if unset, matching uvicorn's own default.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}
    env_file:
      - .env
    environment:
      # Runtime role — NOT the table owner, so FORCE ROW LEVEL SECURITY
      # (set per-table in the initial migration) actually applies to it.
      DATABASE_URL: postgresql+asyncpg://dmarc_app:${DMARC_APP_DB_PASSWORD:-dmarc_app}@db:5432/${POSTGRES_DB:-dmarc}
      DNS_RESOLVER_HOST: resolver
      # See the updater service below — unset means the "Update now"
      # button 503s cleanly rather than erroring obscurely.
      UPDATER_URL: http://updater:9999
      UPDATER_SHARED_SECRET: ${UPDATER_SHARED_SECRET:-}
    ports:
      # Published on this host so the NPM VM (separate host, no shared Docker
      # network) can reverse-proxy to <this-host-ip>:8000. Bind to a specific
      # interface here instead of 0.0.0.0 if this host has a public NIC that
      # should NOT expose the API directly.
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      resolver:
        condition: service_started
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/bjd1997/yetanotherdmarctool:${APP_VERSION:-latest}
    restart: unless-stopped
    command: python -m app.workers.scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dmarc_app:${DMARC_APP_DB_PASSWORD:-dmarc_app}@db:5432/${POSTGRES_DB:-dmarc}
      DNS_RESOLVER_HOST: resolver
    depends_on:
      migrate:
        condition: service_completed_successfully
      resolver:
        condition: service_started
    networks:
      - internal

  # Powers the "Update now" button in the admin console (see
  # app/services/updater_client.py, app/routers/admin_updates.py) — the
  # one component with Docker socket access, deliberately isolated from
  # api/worker (which handle untrusted HTTP input) into its own small,
  # single-purpose container. See updater/server.py's header comment for
  # the full risk writeup: this is host-root-equivalent access, inherent
  # to any updater that recreates containers this way. Optional —
  # everything else in this stack works fine without it; leave
  # UPDATER_SHARED_SECRET unset in .env to not run it at all.
  updater:
    build:
      context: ./updater
    image: ghcr.io/bjd1997/yetanotherdmarctool-updater:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      UPDATER_SHARED_SECRET: ${UPDATER_SHARED_SECRET:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: even a compromised updater can't rewrite
      # docker-compose.yml to smuggle something into the next cycle.
      - .:/workspace:ro
    # No ports: — reachable only from api over the internal network,
    # same non-publishing pattern already used by db/resolver.
    networks:
      - internal

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  db_data:
