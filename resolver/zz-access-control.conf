# Mounted into the mvance/unbound image's custom-config directory
# (/opt/unbound/etc/unbound/unbound.conf.d/) — verify this path against the
# image's README for whatever tag is actually pulled, image conventions
# occasionally shift between major versions.
#
# The base image already validates DNSSEC by default (auto-managed root trust
# anchor via unbound-anchor) and listens on all interfaces — this file only
# narrows access-control down from "localhost only" to also allow queries
# from this compose stack's internal network, since api/worker query this
# resolver over the Docker network rather than over loopback.
server:
    access-control: 127.0.0.1/32 allow
    access-control: 172.28.0.0/24 allow
