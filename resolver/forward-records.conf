# Base image's own forward-zone config (forwards everything to Cloudflare
# over DNS-over-TLS rather than doing pure iterative resolution from the
# root; trimmed only the commented-out alternative-provider examples for
# brevity, nothing active changed) — don't remove this, only the trailing
# include: below is new.
forward-zone:
    # Forward all queries (except those in cache and local zone) to
    # upstream recursive servers
    name: "."
    # Queries to this forward zone use TLS
    forward-tls-upstream: yes

    # https://dnsprivacy.org/wiki/display/DP/DNS+Privacy+Test+Servers

    ## Cloudflare
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    #forward-addr: 2606:4700:4700::1111@853#cloudflare-dns.com
    #forward-addr: 2606:4700:4700::1001@853#cloudflare-dns.com

# This is the only file (besides a-records.conf/srv-records.conf, both
# unused) the base image's generated unbound.conf actually includes — see
# overrides.conf's own header comment for why that file is pulled in from
# here rather than the unbound.conf.d/ path its name implies. Spliced in
# via this include rather than replacing unbound.conf outright, so the
# entrypoint's own memory/CPU-aware cache sizing (computed fresh at
# container start) stays intact.
include: /opt/unbound/etc/unbound/unbound.conf.d/overrides.conf
