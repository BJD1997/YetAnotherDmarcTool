# Loaded via forward-records.conf's own include: line (see that file) —
# this image doesn't actually auto-load unbound.conf.d/*.conf despite the
# directory name suggesting a conf.d convention (confirmed against
# https://github.com/MatthewVance/unbound-docker: the only supported
# extension points are a full custom unbound.conf, or an explicit
# `include:` inside one). Living here purely for organization; the
# directory path itself has no special meaning to Unbound.
server:
    # Reachable over this compose stack's internal network, not just
    # loopback — api/worker query this resolver over Docker DNS rather
    # than 127.0.0.1. (172.16.0.0/12, already allowed by the base image's
    # own default access-control, happens to cover our 172.28.0.0/24
    # subnet too, so this line is currently redundant — kept explicit so
    # access doesn't silently depend on that coincidence if the subnet
    # ever changes.)
    access-control: 172.28.0.0/24 allow

    # The base image floors EVERY cache entry — positive or negative — at
    # cache-min-ttl: 300 (5 min), regardless of what the authoritative
    # server actually published. That's what caused a just-published
    # Cloudflare record (confirmed live via their own API within seconds)
    # to still resolve as missing here for minutes, needing a
    # `docker compose restart resolver` to see it. 0 means trust the
    # origin's own TTL — exactly what the base config's own inline comment
    # recommends ("Zero makes sure the data in the cache is as the domain
    # owner intended"). The cost is more upstream queries, an easy trade
    # for a low-QPS resolver serving one internal app's own verification
    # checks, not a public production resolver.
    cache-min-ttl: 0

    # Separately caps how long a *negative* (NXDOMAIN/NODATA) answer can
    # be cached, regardless of the zone's own SOA MINIMUM (Unbound's
    # built-in default here is 3600s/1h if unset) — the other half of the
    # same bug: a record didn't exist yet, got created, and the "doesn't
    # exist" answer kept being served long after the real one was live.
    cache-max-negative-ttl: 60

    # The actual dominant cause of the stale-answer symptom turned out to
    # be this, not the two settings above: the base image sets
    # `serve-expired: yes` (RFC 8767) with no serve-expired-ttl bound,
    # which defaults to 0 = unlimited — meaning once an entry expires,
    # Unbound answers from the stale copy instantly and refreshes in the
    # background *forever*, never blocking on a real lookup on its own.
    # Confirmed live: a query kept returning a stale NODATA answer with an
    # "EDE: 3 (Stale Answer)" flag well past our cache-max-negative-ttl
    # above. serve-expired-client-timeout flips the priority instead: try
    # a real upstream lookup first, and only fall back to the stale cached
    # answer if that takes longer than this many milliseconds — so a
    # normal check gets a genuinely fresh answer, while a real upstream
    # outage still degrades gracefully to the stale copy rather than
    # failing outright (the actual point of RFC 8767).
    serve-expired-client-timeout: 1800
